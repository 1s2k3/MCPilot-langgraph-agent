services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-platform-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-demo:
    build: ./mcp-demo
    container_name: agent-platform-mcp-demo
    environment:
      MCP_DEMO_PORT: "8001"
    ports:
      - "8001:8001"

  api:
    build: ./backend
    container_name: agent-platform-api
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-agent-platform}
      LANGGRAPH_STRICT_MSGPACK: "true"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      SCRIPTED_LLM: ${SCRIPTED_LLM:-false}
      MCP_DEMO_URL: http://mcp-demo:8001/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-demo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    container_name: agent-platform-web
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_started

  # LangGraph Studio 交互式调试（图结构 / Time Travel / 热重载）
  # 浏览器打开: https://smith.langchain.com/studio/?baseUrl=http://localhost:${LANGGRAPH_STUDIO_PORT:-2024}
  # 默认不随 `docker compose up` 启动；用 `docker compose --profile studio up` 按需拉起
  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile.studio
    container_name: agent-platform-studio
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform?connect_timeout=3
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-agent-platform}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      SCRIPTED_LLM: ${SCRIPTED_LLM:-false}
      # 容器内连演示 MCP：studio.py 的 setdefault 被此 env 覆盖（localhost → mcp-demo）
      MCP_DEMO_URL: http://mcp-demo:8001/mcp
    ports:
      - "${LANGGRAPH_STUDIO_PORT:-2024}:2024"
    volumes:
      # 让 .env 的改动免重建生效；pydantic Settings env_file 会读取 /app/.env
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-demo:
        condition: service_started
    profiles: ["studio"]

volumes:
  pgdata:
