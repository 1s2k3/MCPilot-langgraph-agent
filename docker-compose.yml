services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-platform-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api / web / mcp-demo 服务在 M2–M6 里程碑加入

volumes:
  pgdata:
