services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-platform-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-demo:
    build: ./mcp-demo
    container_name: agent-platform-mcp-demo
    environment:
      MCP_DEMO_PORT: "8001"
    expose:
      - "8001"

  # api / web 服务在 M3/M6 里程碑加入；api 通过 MCP_DEMO_URL=http://mcp-demo:8001/mcp 接入

volumes:
  pgdata:
