name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend
      - run: ruff format --check backend

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: pytest backend/tests/unit -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_platform
      SCRIPTED_LLM: "true"
      ALLOW_PRIVATE_MCP_URLS: "true"
      EMBEDDING_CACHE_DIR: ~/.cache/fastembed
      SEED_DEMO_MCP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-all-MiniLM-L6-v2
      - run: pip install -e "backend[dev]"
      - run: cd mcp-demo && npm ci
      - run: cd backend && alembic upgrade head
      - run: cd backend && python -c "import os; from fastembed import TextEmbedding; TextEmbedding(model_name='sentence-transformers/all-MiniLM-L6-v2', cache_dir=os.path.expanduser('~/.cache/fastembed')); print('embedder ready')"
      - run: pytest backend/tests/integration -q
